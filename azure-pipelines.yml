#trigger:
#  branches:
#    include:
#    - main
#    - release/*

pool:
  vmImage: 'windows-latest'

variables:
  npm_config_cache: $(Pipeline.Workspace)/.npm

# Define the pipeline stages
stages:
- stage: Build
  displayName: 'Build and Test'
  jobs:
  - job: Build
    displayName: 'Build Package'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Install Node.js'

    - task: Npm@1
      displayName: "Version increase"
      inputs:
        command: 'custom'
        customCommand: 'version patch'
        
    - task: Npm@1
      displayName: "Npm ci"
      inputs:
        command: "ci"
        verbose: true

    - task: Npm@1
      displayName: Build
      inputs:
        command: custom
        verbose: false
        customCommand: "run build"

    - task: SnykSecurityScan@1
      inputs:
        serviceConnectionEndpoint: 'Goran Snyk'
        testType: 'app'
        monitorWhen: 'always'
        failOnIssues: true
        projectName: 'Pegasus/ReportingUI'
        organization: 'crogox'

    - task: CopyFiles@2
      inputs:
        SourceFolder: 'dist'
        Contents: '**'
        TargetFolder: '$(Build.ArtifactStagingDirectory)/dist'
      displayName: 'Copy dist folder to artifacts'

    - task: CopyFiles@2
      inputs:
        Contents: |
          package.json
          README.md
          LICENSE
          .npmrc
        TargetFolder: '$(Build.ArtifactStagingDirectory)'
      displayName: 'Copy package files to artifacts'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'package'
        publishLocation: 'Container'
      displayName: 'Publish package artifact'

    - task: Npm@1
      displayName: "Publish Npm Package"
      inputs:
        command: 'publish'
        workingDir: '$(System.ArtifactsDirectory)/package'
        publishRegistry: 'useFeed'
        publishFeed: 'pegasus'