trigger:
  branches:
    include:
    - main
    - release/*

pool:
  vmImage: 'windows-latest'

variables:
  npm_config_cache: $(Pipeline.Workspace)/.npm

# Define the pipeline stages
stages:
- stage: Build
  displayName: 'Build and Test'
  jobs:
  - job: Build
    displayName: 'Build Package'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '16.x'
      displayName: 'Install Node.js'

    - task: Cache@2
      inputs:
        key: 'npm | "$(Agent.OS)" | package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
        path: $(npm_config_cache)
      displayName: 'Cache npm packages'

    - script: |
        npm ci
      displayName: 'Install dependencies'

    - script: |
        npm run build -- --prod
      displayName: 'Build package'

    - script: |
        npm test
      displayName: 'Run tests'
      continueOnError: true  # Continue even if tests fail

    - task: CopyFiles@2
      inputs:
        SourceFolder: 'dist'
        Contents: '**'
        TargetFolder: '$(Build.ArtifactStagingDirectory)/dist'
      displayName: 'Copy dist folder to artifacts'

    - task: CopyFiles@2
      inputs:
        Contents: |
          package.json
          README.md
          LICENSE
          .npmrc
        TargetFolder: '$(Build.ArtifactStagingDirectory)'
      displayName: 'Copy package files to artifacts'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'package'
        publishLocation: 'Container'
      displayName: 'Publish package artifact'

- stage: Publish
  displayName: 'Publish Package'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: Publish
    displayName: 'Publish to Azure Artifacts'
    steps:
    - checkout: self
      displayName: 'Checkout code'
      
    - task: DownloadBuildArtifacts@0
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'package'
        downloadPath: '$(System.ArtifactsDirectory)'
      displayName: 'Download build artifacts'
      
    - task: NodeTool@0
      inputs:
        versionSpec: '16.x'
      displayName: 'Install Node.js'

    # Increment package version (patch)
    - script: |
        cd $(System.ArtifactsDirectory)/package
        npm version patch --no-git-tag-version
      displayName: 'Increment package version'

    # Publish to Azure Artifacts with verbose output
    - task: Npm@1
      inputs:
        command: 'publish'
        workingDir: '$(System.ArtifactsDirectory)/package'
        publishRegistry: 'useFeed'
        publishFeed: 'dbd3a592-3bd3-427d-81d2-1aef2f9e4a6f/c296f9a0-cc3d-45bd-90c3-ffcb1737fdaf'