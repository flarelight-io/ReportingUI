pool:
  vmImage: 'windows-latest'

variables:
  npm_config_cache: $(Pipeline.Workspace)/.npm

# Define the pipeline stages
stages:
- stage: Build
  displayName: 'Build and Test'
  jobs:
  - job: Build
    displayName: 'Build Package'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Install Node.js'
        
    - task: Npm@1
      displayName: "Npm ci"
      inputs:
        command: "ci"
        verbose: true

    - task: Npm@1
      displayName: Build
      inputs:
        command: custom
        verbose: false
        customCommand: "run build"

    - task: SnykSecurityScan@1
      inputs:
        serviceConnectionEndpoint: 'Goran Snyk'
        testType: 'app'
        monitorWhen: 'always'
        failOnIssues: true
        projectName: 'Pegasus/ReportingUI'
        organization: 'crogox'

    - task: Npm@1
      displayName: 'Publish'
      continueOnError: true
      inputs:
        command: 'publish'
        publishRegistry: 'useFeed'
        publishFeed: 'dbd3a592-3bd3-427d-81d2-1aef2f9e4a6f/c296f9a0-cc3d-45bd-90c3-ffcb1737fdaf'