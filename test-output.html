r(--fl-border-color, #e4e4e7)}.title-container{display:flex;align-items:center;gap:8px}.widget-title{font-size:14px;font-weight:500;margin:0;color:var(--fl-text-color-primary)}.hidden-badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:16px;background-color:rgba(251, 188, 5, 0.1);color:var(--fl-warning-color, #d97706);font-weight:500}.widget-actions{display:flex;gap:4px}.action-button{display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:4px;padding:4px;cursor:pointer;color:var(--fl-text-color-secondary, #6b7280);transition:background-color 0.2s, color 0.2s}.action-button:hover{background-color:var(--fl-border-color, rgba(0, 0, 0, 0.05));color:var(--fl-text-color-primary, #374151)}.menu-dots{font-size:16px;font-weight:bold;line-height:1}.widget-body{flex:1;overflow:auto;color:var(--fl-text-color-primary)}.widget-body.with-title{padding:16px}.widget-body.no-title{padding:0}</style><div class="widget-card sc-base-widget"><div class="widget-header sc-base-widget"><div class="title-container sc-base-widget"><h3 class="widget-title sc-base-widget">Summary</h3></div></div><div class="widget-body with-title sc-base-widget"><slot class="sc-base-widget"></slot></div></div></template><div class="text-widget-container text-left vertical-top sc-text-widget"><div class="text-content text-medium sc-text-widget"></div></div></base-widget></template> </text-widget> </div> </div> </body></html>
