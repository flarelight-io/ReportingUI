name: Build and Test

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest

    env:
      npm_config_cache: ${{ github.workspace }}/.npm

    steps:
    - name: 🧾 Checkout Code
      uses: actions/checkout@v3

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22'

    - name: 📦 NPM Install
      run: npm ci --no-cleanup

    - name: 🛠️ Build
      run: npm run build

    - name: 🧪 Snyk Scan
      uses: snyk/actions/node@master
      with:
        command: test
        project: Pegasus/ReportingUI
        args: --all-projects --severity-threshold=medium
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}  

    - name: 📤 Publish Package (GitHub Packages)
      if: success()
      run: |
        npm config set //npm.pkg.github.com/:_authToken $TOKEN
        npm publish
      env:
        TOKEN: ${{ secrets.GITHUB_TOKEN }}
