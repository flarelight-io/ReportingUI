name: Clean NPM Install

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 🧾 Checkout Code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v3.9.1
      with:
        node-version: '22'

    - name: 🧹 Remove ALL npmrc files
      run: |
        rm -f ~/.npmrc
        rm -f .npmrc

    - name: 🔧 Force public registry and scope fallback
      run: |
        echo "registry=https://registry.npmjs.org/" > ~/.npmrc
        echo "@flarelight-io:registry=https://registry.npmjs.org/" >> ~/.npmrc

    - name: 🧪 Show .npmrc
      run: cat ~/.npmrc

    - name: 📦 Run npm install
      run: npm install --verbose
