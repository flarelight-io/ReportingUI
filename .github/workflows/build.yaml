name: Reporting UI Library

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest

    steps:
    - name: 🧾 Checkout Code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v3.9.1
      with:
        node-version: '22'

    - name: 🧹 Remove ALL npmrc files
      run: |
        rm -f ~/.npmrc
        rm -f .npmrc

    - name: 🔧 Force public registry and scope fallback
      run: |
        echo "registry=https://registry.npmjs.org/" > ~/.npmrc
        echo "@flarelight-io:registry=https://registry.npmjs.org/" >> ~/.npmrc

    - name: 🧹 Clean lockfile and modules
      run: |
        rm -rf node_modules package-lock.json
        npm cache clean --force

    - name: 📦 Fresh Install
      run: npm install

    - name: 🛠️ Build
      run: npm run build

    - name: 🔐 Configure GitHub Packages Auth
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > ~/.npmrc
        echo "registry=https://npm.pkg.github.com/" >> ~/.npmrc

    - name: 📤 Publish Package (GitHub Packages)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: npm publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
