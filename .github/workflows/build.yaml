name: Build and Test

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: 🧾 Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js environment
      uses: actions/setup-node@v3.9.1
    
    - name: 🧹 Remove local .npmrc if present
      run: rm -f .npmrc
    - run: npm ci
    - run: npm run build
    - run: npm publish
          
