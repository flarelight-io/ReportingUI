name: Build and Test

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: 🧾 Checkout Code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        registry-url: https://npm.pkg.github.com/
        scope: "@flarelight-io"
      env:
         NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

    - name: 📦 NPM Install
      run: npm ci --no-cleanup
      env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    - name: 🛠️ Build
      run: npm run build

    - name: 🧪 Snyk Scan
      uses: snyk/actions/node@master
      with:
        command: test
        project: Pegasus/ReportingUI
        args: --all-projects --severity-threshold=medium
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}  

    - name: 📤 Publish Package (GitHub Packages)
      if: success()
      run: npm publish
      env:
        TOKEN: ${{ secrets.GITHUB_TOKEN }}
