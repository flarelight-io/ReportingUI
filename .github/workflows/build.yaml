name: Reporting UI Library

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm (only publishes when run from main)'
        type: boolean
        default: true

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for npm provenance / trusted publishing

    steps:
    - name: 🧾 Checkout Code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v3.9.1
      with:
        node-version: '22'

    # Trusted publishing (OIDC) needs npm >= 11.5.1; the npm bundled with Node 22 is older and fails with ENEEDAUTH
    - name: ⬆️ Upgrade npm for trusted publishing
      run: |
        npm install -g npm@^11.5.1
        node --version
        npm --version

    - name: 🧹 Remove ALL npmrc files
      run: |
        rm -f ~/.npmrc
        rm -f .npmrc

    - name: 🔧 Force public registry and scope fallback
      run: |
        echo "registry=https://registry.npmjs.org/" > ~/.npmrc
        echo "@flarelight-io:registry=https://registry.npmjs.org/" >> ~/.npmrc

    - name: 🧹 Clean lockfile and modules
      run: |
        rm -rf node_modules package-lock.json
        npm cache clean --force

    - name: 📦 Fresh Install
      run: npm install

    - name: 🛠️ Build
      run: npm run build

    - name: 📤 Publish Package (npmjs.org)
      if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
      run: npm publish --provenance --access public
